<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    
    
    <body>
        <div class="title">
            <img class="logo" src="images/logo.png" alt="image of the website's logo">
            <img class="user-avatar" src="images/user-avatar.png" alt="User's profile picture">
        </div>
        <div class="post">
            
            <div class="header">
                <img class="avatar" src="images/avatar-vangogh.jpg" alt="The poster's profile picture">
                <div>
                    <div><span class="name">Vincent van Gogh</span></div>
                    <span class="location">Zundert, Netherlands</span>
                </div>
            </div>
            
            <div>
                <img class="img" src="images/post-vangogh.jpg" alt="Poster's selfie image">
            </div>

            <div class="interactions">
                <img class="icon" src="images/icon-heart.png" alt="Instagram's heart button">
                <img class="icon" src="images/icon-comment.png" alt="Instagram's comment button">
                <img class="icon" src="images/icon-dm.png" alt="Instagram's dm button">
                <p class="likes"><span>21,492 likes</span></p>
                <p class="comment"><span>vincey1853</span> just took a few mushrooms lol</p>
            </div>
            
        </div>
        <script src="index.js"></script>
    </body>
</html>
