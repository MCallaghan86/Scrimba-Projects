<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="theme-container">
            <label for="theme-select">Mode:</label>
            <select name="theme" id="theme-select">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </div>    
        <div id="hero">
            <h1>Generate a <br />
                <span>random password<span>
            </h1>
            <h3>Never use an insecure password again.</h3>
            <div id="password-generator">
                <button id="pass-btn" onclick="generatePasswords()">Generate passwords</button>
                <div id="pass-options">
                    <label for="password-length" id="length-label">Length: 15</label>
                    <input type="range" id="length-slider" min="10" max="17" value="15" step="1">
                    <label class="options-row">Include Numbers
                    <input type="checkbox">
                    </label>
                    <label class="options-row">Include Symbols
                    <input type="checkbox">
                    </label>
                </div>
            </div>  
        </div>    
        <div id="password-container"> 
            <p class="password-el"></p>
            <p class="password-el"></p>
        </div>
        <script src="index.js"></script>
    </body>
</html>
