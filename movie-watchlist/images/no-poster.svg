<svg xmlns="http://www.w3.org/2000/svg" width="300" height="444" viewBox="0 0 300 444" role="img" aria-label="No poster available">
  <rect width="300" height="444" fill="#2b2b2b"/>
  <rect x="12" y="12" width="276" height="420" fill="none" stroke="#444" stroke-width="2" rx="6"/>

  <!-- Clapperboard icon -->
  <g transform="translate(150 190)" fill="none" stroke="#8a8a8a" stroke-width="6" stroke-linejoin="round">
    <!-- board -->
    <rect x="-55" y="-20" width="110" height="70" rx="4"/>
    <!-- clapper (tilted) -->
    <g transform="rotate(-14 -55 -20)">
      <rect x="-55" y="-44" width="110" height="24" rx="3"/>
      <line x1="-30" y1="-44" x2="-40" y2="-20"/>
      <line x1="0" y1="-44" x2="-10" y2="-20"/>
      <line x1="30" y1="-44" x2="20" y2="-20"/>
    </g>
  </g>

  <text x="150" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#b5b5b5">No poster</text>
  <text x="150" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#b5b5b5">available</text>
</svg>
